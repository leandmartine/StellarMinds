  <!-- Star accent -->
  <path fill="#e8ecf8" d="M32 18.5l1.55 4.55 4.8.15-3.8 2.95 1.35 4.6L32 28.4l-3.9 2.35 1.35-4.6-3.8-2.95 4.8-.15z" opacity="0.95"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="StellarMinds">
  <defs>
    <linearGradient id="orb" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5eead4"/>
      <stop offset="45%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.15"/>
    </radialGradient>
  </defs>
  <!-- Soft outer glow -->
  <circle cx="32" cy="32" r="30" fill="url(#orb)" opacity="0.28"/>
  <!-- Main brand orb -->
  <circle cx="32" cy="32" r="24" fill="url(#orb)"/>
  <circle cx="32" cy="32" r="24" fill="url(#glow)"/>
  <!-- Inner dark core (como brand-orb::after) -->
